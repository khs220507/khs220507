name: Refresh blog links
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-blog-links
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public blog feed
        run: python3 scripts/update_blog_posts.py
      - name: Save refreshed links
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh latest blog links'
          git push
